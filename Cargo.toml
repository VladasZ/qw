[workspace]

resolver = "3"

members = ["qw"]

default-members = ["qw"]

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
Inflector = "0.11"
anyhow = "1.0"
chrono = "0.4"
comfy-table = "7.2"
dialoguer = "0.12"
serde = { version = "1", features = ["derive"] }
structopt = "0.3"
tempfile = "3"
toml = "1.1"


# sercli = { path = "../sercli/sercli" }
sercli = "0.4.0"
